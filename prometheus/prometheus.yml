# Prometheus lee las métricas de la app cada 5 segundos
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: securedev-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]          # nombre del servicio en compose.yaml

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
